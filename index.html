<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince | Android Developer</title>
    
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Force Deep Dark Mode Base */
        body {
            background-color: rgb(18, 14, 31);
            color: #ffffff !important;
            overflow-x: hidden;
        }

        /* Override Global Navbar to Dark Glass */
        .navbar {
            background: rgba(10, 10, 10, 0.7) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(15px) !important;
            z-index: 100;
        }
        .navbar a { color: #888 !important; }
        .navbar a.active, .navbar a:hover { color: #fff !important; background: rgba(255,255,255,0.1) !important; }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 70vw;
            height: 70vw;
            max-width: 600px;
            max-height: 600px;
            background: linear-gradient(45deg, rgba(122, 0, 255, 0.25), rgba(255, 0, 127, 0.15));
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite alternate;
            transition: opacity 0.1s ease;
        }

        @keyframes floatGlow {
            0% { transform: translate(-50%, 0) scale(1); }
            100% { transform: translate(-50%, 30px) scale(1.1); }
        }

        /* Hero Section Adjustments */
        .hero-dark {
            position: relative;
            min-height: 120vh; /* Extra height taaki scroll effect feel ho */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 100px;
            padding-bottom: 50px;
            z-index: 1;
        }

        /* Giant Text (Behind Image) */
        .giant-text-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            z-index: 1;
        }

        .giant-text {
            font-size: 16vw; 
            font-weight: 900;
            white-space: nowrap;
            /* Premium Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #333333 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -3px;
            opacity: 0.9;
        }

        /* Profile Image */
        .hero-image-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 2vh;
        }

        .floating-img {
            width: 320px;
            max-width: 85vw;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0px 25px 35px rgba(0,0,0,0.9));
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Subtitle & Buttons */
        .hero-subtitle {
            position: relative;
            z-index: 3;
            max-width: 650px;
            padding: 0 20px;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s forwards 0.5s;
        }

        .hero-subtitle p {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        /* Premium Glass Buttons */
        .hero-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-accent {
            background: linear-gradient(90deg, #ff007f, #7a00ff);
            border: none;
            box-shadow: 0 4px 15px rgba(122, 0, 255, 0.4);
        }

        .btn-accent:hover {
            background: linear-gradient(90deg, #ff1a8c, #8a1aff);
            box-shadow: 0 8px 25px rgba(122, 0, 255, 0.6);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .giant-text { font-size: 24vw; letter-spacing: -1px; }
            .nav-links { display: none; }
            .navbar { justify-content: center; }
            .floating-img { width: 280px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <nav class="navbar">
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="services.html">Services</a>
        </div>
        <a href="contact.html" class="btn-glass btn-accent" style="padding: 10px 20px; font-size: 13px;">Contact Me</a>
    </nav>

    <main class="hero-dark">
        
        <div class="giant-text-container">
            <h1 class="giant-text">HI, I'M PRINCE</h1>
        </div>
        
        <div class="hero-image-wrapper">
            <img src="profile-pic.png" alt="Prince" class="floating-img">
        </div>

        <div class="hero-subtitle">
            <p>AN ANDROID DEVELOPER PASSIONATE ABOUT CRAFTING BOLD, FAST, AND PREMIUM MOBILE EXPERIENCES ⚡</p>
            
            <div class="hero-btns">
                <a href="projects.html" class="btn-glass btn-accent">View Projects</a>
                <a href="contact.html" class="btn-glass">Hire Me</a>
            </div>
        </div>

    </main>
    
    <script src="script.js"></script>

    <script>
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            
            // Effect fades to black within 400px of scrolling
            let ratio = scrollY / 400; 
            if (ratio > 1) ratio = 1;
            
            // Start Color RGB: (18, 14, 31) -> Premium Dark Purple/Blue
            // End Color RGB: (0, 0, 0) -> Pure Black
            const r = Math.round(18 * (1 - ratio));
            const g = Math.round(14 * (1 - ratio));
            const b = Math.round(31 * (1 - ratio));
            
            // Apply the dynamic background color smoothly
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            
            // Glow effect fades out slightly as you scroll down
            const glow = document.querySelector('.ambient-glow');
            if(glow) {
                glow.style.opacity = 1 - (ratio * 0.8);
            }
        });
    </script>
</body>
</html>
