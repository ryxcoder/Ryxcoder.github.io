<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* Force Deep Dark Mode Base (Matches Ecosystem) */
        body { background-color: rgb(18, 14, 31); color: #ffffff !important; overflow-x: hidden; }

        /* Premium Glass Navbar */
        .navbar {
            display: flex; overflow-x: auto; gap: 5px; padding: 8px 10px;
            background: rgba(15, 15, 15, 0.65) !important; border: 1px solid rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px) !important; -webkit-backdrop-filter: blur(15px) !important;
            border-radius: 40px; position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
            white-space: nowrap; width: max-content; max-width: 90%; z-index: 100;
        }
        .navbar::-webkit-scrollbar { display: none; }
        .navbar a { text-decoration: none; color: #999 !important; padding: 10px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; transition: all 0.3s ease; }
        .navbar a.active, .navbar a:hover { background: rgba(255, 255, 255, 0.1) !important; color: #fff !important; }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            width: 70vw; height: 70vw; max-width: 600px; max-height: 600px;
            background: linear-gradient(45deg, rgba(122, 0, 255, 0.2), rgba(255, 0, 127, 0.15));
            filter: blur(90px); border-radius: 50%; z-index: -1; animation: floatGlow 10s ease-in-out infinite alternate;
        }
        @keyframes floatGlow { 0% { transform: translate(-50%, 0) scale(1); } 100% { transform: translate(-50%, 30px) scale(1.1); } }

        /* Main Container */
        .contact-section { padding: 120px 20px 60px 20px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; }

        .page-header h1 {
            font-size: clamp(3rem, 10vw, 4.5rem); font-weight: 900; letter-spacing: -2px;
            background: linear-gradient(to right, #ffffff, #666666); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
            opacity: 0; transform: translateY(20px); animation: fadeUp 0.8s forwards;
        }
        .page-header p {
            color: #a0a0a0; font-size: 1.1rem; line-height: 1.6; margin-bottom: 40px;
            opacity: 0; transform: translateY(20px); animation: fadeUp 0.8s forwards 0.1s;
        }

        /* Ultra-Premium Liquid Contact Cards */
        .contact-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .contact-card {
            position: relative; overflow: hidden; display: flex; align-items: center; gap: 20px;
            background: rgba(20, 20, 20, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 18px 24px; border-radius: 16px; text-decoration: none; color: #fff;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease, border-color 0.4s ease;
            z-index: 1; opacity: 0; transform: translateY(30px); animation: fadeUp 0.8s forwards;
        }
        
        .contact-card:nth-child(1) { animation-delay: 0.2s; }
        .contact-card:nth-child(2) { animation-delay: 0.3s; }
        .contact-card:nth-child(3) { animation-delay: 0.4s; }
        .contact-card:nth-child(4) { animation-delay: 0.5s; }

        /* Liquid Flow Background */
        .contact-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            opacity: 0; background-size: 200% 200%; transition: opacity 0.8s ease; animation: flowGradient 4s ease infinite;
        }
        @keyframes flowGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .contact-card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 15px 30px rgba(0,0,0,0.4); }
        .contact-card:active { transform: scale(0.96); transition: transform 0.1s ease; }
        .contact-card:active::before { opacity: 1; transition: opacity 0.2s ease; }

        /* Brand Colors for Flow */
        .card-wa::before { background: linear-gradient(120deg, #111, #0a3318, #111, #134d28); }
        .card-wa:active { border-color: #25D366; box-shadow: 0 0 25px rgba(37, 211, 102, 0.25); }
        .card-wa:hover .contact-icon, .card-wa:active .contact-icon { background: #25D366; }

        .card-tele::before { background: linear-gradient(120deg, #111, #0b2c3d, #111, #144661); }
        .card-tele:active { border-color: #229ED9; box-shadow: 0 0 25px rgba(34, 158, 217, 0.25); }
        .card-tele:hover .contact-icon, .card-tele:active .contact-icon { background: #229ED9; }

        .card-mail::before { background: linear-gradient(120deg, #111, #471510, #111, #631d16); }
        .card-mail:active { border-color: #ea4335; box-shadow: 0 0 25px rgba(234, 67, 53, 0.25); }
        .card-mail:hover .contact-icon, .card-mail:active .contact-icon { background: #ea4335; }

        .card-git::before { background: linear-gradient(120deg, #111, #211830, #111, #36294d); }
        .card-git:active { border-color: #6e5494; box-shadow: 0 0 25px rgba(110, 84, 148, 0.25); }
        .card-git:hover .contact-icon, .card-git:active .contact-icon { background: #6e5494; }

        /* Icons & Text */
        .contact-icon { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.05); border-radius: 50%; flex-shrink: 0; transition: background 0.3s ease; }
        .contact-icon svg { width: 22px; height: 22px; fill: #fff; }
        .contact-info { display: flex; flex-direction: column; }
        .contact-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: #fff; }
        .contact-info p { font-size: 14px; color: #aaa; margin: 0; font-weight: 500; }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

    <script src="script.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY; let ratio = scrollY / 300; if (ratio > 1) ratio = 1;
            const r = Math.round(18 * (1 - ratio)); const g = Math.round(14 * (1 - ratio)); const b = Math.round(31 * (1 - ratio));
            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
            const glow = document.querySelector('.ambient-glow'); if(glow) glow.style.opacity = 1 - (ratio * 0.9);
        });
    </script>
